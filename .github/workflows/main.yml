name: Build & Publish Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify versionCode or versionName Changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual: build habilitado."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="${AFTER}~1"
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "Commit inicial detectado: build habilitado."
              echo "should_build=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if git diff "$BEFORE" "$AFTER" -- app/build.gradle.kts | grep -qE '^\+.*(versionCode|versionName)\s*='; then
            echo "Alteração de versão detectada em app/build.gradle.kts: build habilitado."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "app/build.gradle.kts foi alterado, mas versionCode/versionName não mudaram. Build ignorado."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Android APKs
    needs: check_version
    if: needs.check_version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment: DEBUG_KEYSTORE_BASE64

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Restore Project Debug Keystore (Permanent Signature)
        env:
          SECRET_DEBUG_KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64"
          elif [ -n "$SECRET_DEBUG_KS" ]; then
            echo "$SECRET_DEBUG_KS" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64"
          else
            echo "::error::debug.keystore.base64 não encontrado no repositório nem no Secret DEBUG_KEYSTORE_BASE64."
            echo "Copie o conteúdo do arquivo debug.keystore.base64 deste projeto para o Secret DEBUG_KEYSTORE_BASE64 no GitHub (ou envie o arquivo debug.keystore.base64 no repositório)."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android | grep -E "Alias|SHA256" || true

      - name: Prepare Release Keystore (If Configured)
        id: release_key
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Usando keystore release customizada dos Secrets do repositório"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_KEYSTORE_BASE64 não configurada; mantendo assinatura permanente debug.keystore para compatibilidade de atualização."
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK (Permanent Signature)
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.configuration-cache=false \
            -Dorg.gradle.jvmargs="-Xmx3g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=daemon \
            --stacktrace

      - name: Build Release APK (When Custom Keystore Exists)
        if: steps.release_key.outputs.has_release == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.configuration-cache=false \
            -Dorg.gradle.jvmargs="-Xmx3g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=daemon \
            --stacktrace

      - name: Collect Built APKs
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/app-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          fi
          ls -lh dist-apks/

      - name: Publish APK & Release Policy to Supabase
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://iodvkbzszlrphuqvywbr.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_SECRET_KEY não configurado nos Secrets do GitHub. Pulando publicação automática no Supabase."
            exit 0
          fi

          python3 - <<'PY'
          import json, hashlib, os, urllib.request

          url = os.environ["SUPABASE_URL"].rstrip("/")
          secret = os.environ["SUPABASE_SECRET_KEY"]

          if os.path.exists("app/build/outputs/apk/release/app-release.apk") and os.path.exists("app/build/outputs/apk/release/output-metadata.json"):
              apk_file = "app/build/outputs/apk/release/app-release.apk"
              meta_file = "app/build/outputs/apk/release/output-metadata.json"
          else:
              apk_file = "app/build/outputs/apk/debug/app-debug.apk"
              meta_file = "app/build/outputs/apk/debug/output-metadata.json"

          with open(meta_file, "r", encoding="utf-8") as f:
              meta = json.load(f)
          elem = meta["elements"][0]
          version_code = int(elem["versionCode"])
          version_name = str(elem["versionName"])
          storage_name = f"pao-com-carne-v{version_name}.apk"
          apk_path = f"app-releases/{storage_name}"

          with open(apk_file, "rb") as f:
              apk_bytes = f.read()
          sha256 = hashlib.sha256(apk_bytes).hexdigest()
          print(f"Uploading {apk_file} -> {apk_path} (version={version_name}/{version_code}, sha256={sha256})")

          # 1. Upload / overwrite APK in Supabase Storage
          up_req = urllib.request.Request(
              f"{url}/storage/v1/object/{apk_path}",
              data=apk_bytes,
              method="POST",
              headers={
                  "apikey": secret,
                  "Authorization": f"Bearer {secret}",
                  "Content-Type": "application/vnd.android.package-archive",
                  "x-upsert": "true",
              },
          )
          with urllib.request.urlopen(up_req, timeout=180) as r:
              print("Storage upload:", r.status, r.read().decode())

          # 2. Deactivate older releases
          patch_req = urllib.request.Request(
              f"{url}/rest/v1/app_releases?version_code=lt.{version_code}",
              data=json.dumps({"active": False}).encode(),
              method="PATCH",
              headers={
                  "apikey": secret,
                  "Authorization": f"Bearer {secret}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
              },
          )
          with urllib.request.urlopen(patch_req, timeout=30) as r:
              print("Deactivated older releases:", r.status)

          # 3. Clean existing row with same version_code before inserting updated artifact
          del_req = urllib.request.Request(
              f"{url}/rest/v1/app_releases?version_code=eq.{version_code}",
              method="DELETE",
              headers={
                  "apikey": secret,
                  "Authorization": f"Bearer {secret}",
              },
          )
          with urllib.request.urlopen(del_req, timeout=30) as r:
              print("Cleaned same version_code:", r.status)

          # 4. Insert active mandatory release
          payload = {
              "version_name": version_name,
              "version_code": version_code,
              "min_supported_code": version_code,
              "mandatory": True,
              "apk_path": apk_path,
              "sha256": sha256,
              "changelog": f"Atualização v{version_name} (código {version_code}) publicada automaticamente.",
              "release_reason": "Atualização obrigatória para manter compatibilidade e integridade dos dados.",
              "active": True,
          }
          ins_req = urllib.request.Request(
              f"{url}/rest/v1/app_releases",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "apikey": secret,
                  "Authorization": f"Bearer {secret}",
                  "Content-Type": "application/json",
                  "Prefer": "return=representation",
              },
          )
          with urllib.request.urlopen(ins_req, timeout=30) as r:
              print("Inserted app_releases:", r.status, r.read().decode())
          PY

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaoComCarne-APKs
          path: dist-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
